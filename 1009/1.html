<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F5F6FA;
            color: #2A2E3E;
            overflow: hidden;
        }

        .container {
            width: 1440px;
            height: 1024px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: #F5F6FA;
        }

        /* ========== 헤더 ========== */
        .header {
            width: 100%;
            height: 80px;
            background-color: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            padding: 0 40px;
            position: relative;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #1F2BFF;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 200px;
        }

        .alert-banner {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background-color: #E8332A;
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 100;
        }

        .alert-banner.active {
            display: block;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-icon {
            position: relative;
            width: 40px;
            height: 40px;
            background-color: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .notification-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #E8332A;
            color: #FFFFFF;
            width: 24px;
            height: 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .profile-icon {
            width: 48px;
            height: 48px;
            background-color: #1F2BFF;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }

        /* ========== 메인 컨텐츠 ========== */
        .content {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px 40px;
            overflow: hidden;
        }

        /* ========== 좌측 사이드바 ========== */
        .sidebar {
            width: 220px;
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-y: auto;
        }

        .sidebar-item {
            padding: 12px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .sidebar-item:hover {
            background-color: #F9F9FB;
        }

        .sidebar-item.selected {
            background-color: #E0E3FA;
            border-left: 4px solid #1F2BFF;
            padding-left: 8px;
        }

        .sidebar-item-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .sidebar-item-label {
            flex: 1;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: auto;
            margin-right: 8px;
        }

        .status-dot.normal {
            background-color: #10B981;
        }

        .status-dot.caution {
            background-color: #F59E0B;
        }

        .status-dot.warning {
            background-color: #EF4444;
        }

        .status-dot.danger {
            background-color: #E8332A;
        }

        .arrow {
            font-size: 12px;
            color: #6B7280;
        }

        .sub-menu {
            display: none;
            padding-left: 24px;
        }

        .sub-menu.open {
            display: block;
        }

        .sub-menu-item {
            padding: 8px 12px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 2px;
            font-size: 14px;
            font-weight: 500;
            color: #6B7280;
            transition: all 0.2s ease;
        }

        .sub-menu-item:hover {
            background-color: #F0F2FE;
            color: #1F2BFF;
        }

        .sub-menu-item.selected {
            background-color: #F0F2FE;
            border-left: 2px solid #1F2BFF;
            color: #1F2BFF;
            padding-left: 10px;
        }

        .sub-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: auto;
        }

        /* ========== 중앙 맵/카메라 영역 ========== */
        .center-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .map-card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            width: 520px;
            height: 470px;
        }

        .card-label {
            font-size: 14px;
            font-weight: bold;
            color: #2A2E3E;
            margin-bottom: 12px;
        }

        .map-area {
            width: 100%;
            height: 350px;
            background-color: #E6E6E6;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .map-svg {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .breakwater-line {
            stroke: #1F2BFF;
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
        }

        .tetrapod {
            fill: #9CA3AF;
            opacity: 0.6;
        }

        .detected-person {
            width: 16px;
            height: 16px;
            background-color: #E8332A;
            border: 3px solid #FFFFFF;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(232, 51, 42, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(232, 51, 42, 0);
            }
        }

        .detected-person.pulse {
            animation: pulse 2s infinite;
        }

        .person-tooltip {
            position: absolute;
            bottom: 20px;
            left: -40px;
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #2A2E3E;
            white-space: nowrap;
            display: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            z-index: 50;
        }

        .person-tooltip.show {
            display: block;
        }

        .map-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 380px;
        }

        .nav-button {
            width: 40px;
            height: 40px;
            background-color: #1F2BFF;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .nav-button:hover {
            background-color: #152FCC;
        }

        .camera-card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            width: 520px;
            height: 384px;
        }

        .video-area {
            width: 100%;
            height: 320px;
            background-color: #1A1A1A;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .live-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #E8332A;
            color: #FFFFFF;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }

        .video-time {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 500;
            z-index: 10;
        }

        .detection-box {
            position: absolute;
            border: 2px solid #10B981;
            background-color: transparent;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
        }

        .detection-label {
            background-color: #10B981;
            color: #FFFFFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .camera-nav {
            display: flex;
            justify-content: space-between;
            gap: 380px;
        }

        /* ========== 우측 정보 카드들 ========== */
        .right-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 560px;
        }

        .info-card {
            background-color: #FFFFFF;
            border: 2px solid #1F2BFF;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            height: 206px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-card.danger {
            background-color: #FDE3E1;
            border-color: #E8332A;
        }

        .info-card-label {
            font-size: 12px;
            font-weight: 500;
            color: #6B7280;
        }

        .info-card.danger .info-card-label {
            color: #E8332A;
        }

        .info-card-value {
            font-size: 48px;
            font-weight: bold;
            color: #1F2BFF;
            margin-top: 4px;
        }

        .info-card.danger .info-card-value {
            color: #E8332A;
        }

        .info-card-sub {
            font-size: 14px;
            font-weight: 500;
            color: #6B7280;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #E0E3FA;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background-color: #1F2BFF;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .info-card.danger .progress-fill {
            background-color: #E8332A;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #FFFFFF;
            margin-top: 8px;
            width: fit-content;
        }

        .status-badge.info {
            background-color: #0EA5E9;
        }

        .status-badge.caution {
            background-color: #F59E0B;
        }

        .status-badge.warning {
            background-color: #EF4444;
        }

        .status-badge.danger {
            background-color: #E8332A;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .action-button {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            background-color: #1F2BFF;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-button:hover {
            background-color: #152FCC;
        }
        .action-button.secondary {
            color: #1F2BFF;
            background-color: #E0E3FA;
        }
        .action-button.secondary:hover {
            background-color: #D3D8F8;
        }
        .info-card-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .small-label {
            color: #6B7280;
            font-size: 12px;
        }
        .map-legend {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 8px 10px;
            background: #FFFFFFE8;
            border-radius: 6px;
            font-size: 11px;
            z-index: 2;
        }
        .map-nav,
        .camera-nav {
            gap: 12px;
        }
        .camera-card {
            height: 384px;
        }
        .video-area {
            height: 280px;
        }
        .sub-menu-item.selected {
            color: #1F2BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">〰 해안 안전 관제</div>

            <div class="alert-banner" id="alertBanner">
                안전 알림: 기상 상황을 확인해 주세요.
            </div>

            <div class="header-right">
                <button class="notification-icon" id="notificationButton" aria-label="알림">
                    ♧
                    <span class="notification-badge">2</span>
                </button>
                <div class="profile-icon" title="관제 담당자">👤</div>
            </div>
        </header>

        <main class="content">
            <aside class="sidebar">
                <div class="sidebar-item selected" data-site="해운대">
                    <div class="sidebar-item-content">
                        <span>📍</span><span class="sidebar-item-label">해운대구</span>
                    </div>
                    <span class="status-dot caution"></span>
                    <span class="arrow">⌄</span>
                </div>
                <div class="sub-menu open" data-menu="해운대">
                    <div class="sub-menu-item selected" data-sea="해운대 해역">
                        해운대 해역 <span class="sub-status-dot status-dot caution"></span>
                    </div>
                    <div class="sub-menu-item" data-sea="송정 해역">
                        송정 해역 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                </div>

                <div class="sidebar-item" data-site="수영구">
                    <div class="sidebar-item-content">
                        <span>📍</span><span class="sidebar-item-label">수영구</span>
                    </div>
                    <span class="status-dot warning"></span>
                    <span class="arrow">⌄</span>
                </div>
                <div class="sub-menu" data-menu="수영구">
                    <div class="sub-menu-item" data-sea="광안리 해역">
                        광안리 해역 <span class="sub-status-dot status-dot warning"></span>
                    </div>
                    <div class="sub-menu-item" data-sea="수영만">
                        수영만 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                </div>

                <div class="sidebar-item" data-site="남구">
                    <div class="sidebar-item-content">
                        <span>📍</span><span class="sidebar-item-label">남구</span>
                    </div>
                    <span class="status-dot normal"></span>
                    <span class="arrow">⌄</span>
                </div>
                <div class="sub-menu" data-menu="남구">
                    <div class="sub-menu-item" data-sea="오륙도·이기대 해역">
                        오륙도·이기대 해역 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                </div>

                <div class="sidebar-item" data-site="동구">
                    <div class="sidebar-item-content">
                        <span>📍</span><span class="sidebar-item-label">동구</span>
                    </div>
                    <span class="status-dot normal"></span>
                    <span class="arrow">⌄</span>
                </div>
                <div class="sub-menu" data-menu="동구">
                    <div class="sub-menu-item" data-sea="부산항 북항">
                        부산항 북항 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                </div>

                <div class="sidebar-item" data-site="강서구">
                    <div class="sidebar-item-content">
                        <span>📍</span><span class="sidebar-item-label">강서구</span>
                    </div>
                    <span class="status-dot normal"></span>
                    <span class="arrow">⌄</span>
                </div>
                <div class="sub-menu" data-menu="강서구">
                    <div class="sub-menu-item" data-sea="낙동강 하구">
                        낙동강 하구 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                    <div class="sub-menu-item" data-sea="가덕도 해역">
                        가덕도 해역 <span class="sub-status-dot status-dot normal"></span>
                    </div>
                </div>
            </aside>

            <section class="center-section">
                <div class="map-card">
                    <div class="card-label">해안 감시 위치도 <span id="mapTitle">· 해운대 해역</span></div>
                    <div class="map-area">
                        <svg class="map-svg" viewBox="0 0 520 350" role="img" aria-label="시연용 해안 위치도">
                            <rect width="520" height="350" fill="#B9DCE8"/>
                            <path d="M0 0H245L225 56L255 105L217 152L240 202L205 252L230 350H0Z" fill="#DCE7D5"/>
                            <path d="M245 0L260 70L235 120L266 175L230 230L260 290L230 350" class="breakwater-line"/>
                            <path d="M320 42l28 14-10 30-28-14z M390 130l30 12-13 28-28-14z M330 240l32 12-13 28-30-12z" class="tetrapod"/>
                            <circle cx="278" cy="174" r="10" fill="#E8332A" stroke="#fff" stroke-width="4"/>
                            <text x="294" y="170" font-size="13" fill="#263247">감지 위치</text>
                        </svg>
                        <div class="map-legend">🔴 감지 위치　━ 방파제</div>
                    </div>
                    <div class="map-nav">
                        <button class="nav-button" id="prevMap" aria-label="이전 위치">‹</button>
                        <button class="nav-button" id="nextMap" aria-label="다음 위치">›</button>
                    </div>
                </div>

                <div class="camera-card">
                    <div class="card-label">현장 CCTV <span id="cameraTitle">· CAM-01</span></div>
                    <div class="video-area">
                        <div class="live-badge">LIVE · 시연 화면</div>
                        <div class="video-time" id="videoTime">--:--:--</div>
                        <div class="detection-box" style="left: 42%; top: 34%; width: 70px; height: 130px;">
                            <span class="detection-label">사람 감지</span>
                        </div>
                    </div>
                    <div class="camera-nav">
                        <button class="nav-button" id="prevCamera" aria-label="이전 카메라">‹</button>
                        <button class="nav-button" id="nextCamera" aria-label="다음 카메라">›</button>
                    </div>
                </div>
            </section>

            <section class="right-section">
                <div class="info-card">
                    <div>
                        <div class="info-card-label">현재 풍속</div>
                        <div class="info-card-value"><span id="windValue">12.4</span><span style="font-size:20px"> m/s</span></div>
                        <div class="info-card-sub" id="windStatus">보통</div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="windBar" style="width:31%"></div></div>
                </div>

                <div class="info-card">
                    <div>
                        <div class="info-card-label">유의 파고</div>
                        <div class="info-card-value"><span id="waveValue">1.2</span><span style="font-size:20px"> m</span></div>
                        <div class="info-card-sub" id="waveStatus">평온</div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="waveBar" style="width:24%"></div></div>
                </div>

                <div class="info-card">
                    <div>
                        <div class="info-card-label">강수량</div>
                        <div class="info-card-value"><span id="rainValue">8.2</span><span style="font-size:20px"> mm/h</span></div>
                        <div class="info-card-sub" id="rainStatus">약한 비</div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="rainBar" style="width:8%"></div></div>
                </div>

                <div class="info-card" id="statusCard">
                    <div>
                        <div class="info-card-label">종합 안전 상태</div>
                        <div class="info-card-value" id="overallStatus" style="font-size:36px">정상</div>
                        <div class="info-card-sub" id="selectedSeaLabel">해운대 해역</div>
                        <span class="status-badge info" id="statusBadge">실시간 관제 중</span>
                    </div>
                    <div class="button-group">
                        <button class="action-button" id="broadcastButton">안내 방송</button>
                        <button class="action-button secondary" id="dispatchButton">출동 요청</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const readings = {
            "해운대 해역": { wind: 12.4, wave: 1.2, rain: 8.2 },
            "송정 해역": { wind: 9.8, wave: 0.9, rain: 4.1 },
            "광안리 해역": { wind: 18.3, wave: 2.1, rain: 15.0 },
            "수영만": { wind: 11.2, wave: 1.1, rain: 6.4 },
            "오륙도·이기대 해역": { wind: 14.1, wave: 1.6, rain: 12.4 },
            "부산항 북항": { wind: 10.2, wave: 0.8, rain: 3.1 },
            "낙동강 하구": { wind: 9.5, wave: 1.0, rain: 2.3 },
            "가덕도 해역": { wind: 13.2, wave: 1.4, rain: 5.2 }
        };

        let selectedSea = "해운대 해역";
        let cameraNumber = 1;
        const $ = id => document.getElementById(id);

        function renderSea(sea) {
            selectedSea = sea;
            const data = readings[sea] || readings["해운대 해역"];

            $("mapTitle").textContent = `· ${sea}`;
            $("selectedSeaLabel").textContent = sea;
            $("cameraTitle").textContent = `· CAM-0${cameraNumber} / ${sea}`;

            $("windValue").textContent = data.wind.toFixed(1);
            $("waveValue").textContent = data.wave.toFixed(1);
            $("rainValue").textContent = data.rain.toFixed(1);

            $("windStatus").textContent = data.wind >= 15 ? "주의" : "보통";
            $("waveStatus").textContent = data.wave >= 1.5 ? "주의" : "평온";
            $("rainStatus").textContent = data.rain >= 15 ? "비" : "약한 비";

            $("windBar").style.width = `${Math.min(data.wind / 40 * 100, 100)}%`;
            $("waveBar").style.width = `${Math.min(data.wave / 5 * 100, 100)}%`;
            $("rainBar").style.width = `${Math.min(data.rain, 100)}%`;

            const risk = data.wind >= 25 || data.wave >= 3 || data.rain >= 50;
            $("overallStatus").textContent = risk ? "위험" : "정상";
            $("statusCard").classList.toggle("danger", risk);
            $("statusBadge").textContent = risk ? "현장 확인 필요" : "실시간 관제 중";
            $("statusBadge").className = `status-badge ${risk ? "danger" : "info"}`;
            $("alertBanner").classList.toggle("active", risk);
        }

        document.querySelectorAll(".sidebar-item").forEach(item => {
            item.addEventListener("click", () => {
                const site = item.dataset.site;
                const menu = document.querySelector(`[data-menu="${site}"]`);
                document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("selected"));
                document.querySelectorAll(".sub-menu").forEach(el => el.classList.remove("open"));
                item.classList.add("selected");
                if (menu) menu.classList.add("open");
            });
        });

        document.querySelectorAll(".sub-menu-item").forEach(item => {
            item.addEventListener("click", () => {
                document.querySelectorAll(".sub-menu-item").forEach(el => el.classList.remove("selected"));
                item.classList.add("selected");
                renderSea(item.dataset.sea);
            });
        });

        $("notificationButton").addEventListener("click", () => {
            $("alertBanner").classList.toggle("active");
        });

        $("broadcastButton").addEventListener("click", () => {
            alert(`${selectedSea} 안내 방송을 요청했습니다.`);
        });

        $("dispatchButton").addEventListener("click", () => {
            alert(`${selectedSea} 현장 출동을 요청했습니다.`);
        });

        $("prevCamera").addEventListener("click", () => {
            cameraNumber = cameraNumber <= 1 ? 3 : cameraNumber - 1;
            renderSea(selectedSea);
        });

        $("nextCamera").addEventListener("click", () => {
            cameraNumber = cameraNumber >= 3 ? 1 : cameraNumber + 1;
            renderSea(selectedSea);
        });

        $("prevMap").addEventListener("click", () => {
            alert("이전 감시 위치로 이동합니다.");
        });

        $("nextMap").addEventListener("click", () => {
            alert("다음 감시 위치로 이동합니다.");
        });

        function updateTime() {
            $("videoTime").textContent = new Date().toLocaleTimeString("ko-KR", {
                hour12: false
            });
        }

        renderSea(selectedSea);
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
