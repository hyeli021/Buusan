<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 방파제 위험 감시 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0d1013; --panel:#12161a; --line:#222a31; --line2:#2d363e;
  --text:#c8d0d8; --muted:#76818b; --hi:#e8edf1;
  --lv0:#3fb27f; --lv1:#d9b441; --lv2:#e8803a; --lv3:#e5484d;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.4 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--text);
  display:grid;grid-template-rows:40px 1fr;
  min-width:1280px;min-height:640px;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line2);border-radius:2px;cursor:pointer}
button:hover{background:#1a2026}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--panel);padding:0 14px;gap:16px}
.logo{height:22px;padding:0 10px;display:flex;align-items:center;border:1px dashed var(--line2);color:var(--muted);font-size:11px;letter-spacing:.12em}
header h1{font-size:13px;font-weight:600;color:var(--hi)}
header .sp{flex:1}
header .meta{color:var(--muted);font-size:12px;display:flex;gap:16px;align-items:center}
header .meta b{color:var(--text);font-weight:500}
.badge{min-width:18px;height:18px;padding:0 5px;background:var(--lv3);color:#fff;font-size:11px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono)}

/* layout */
main{display:grid;grid-template-columns:280px 1fr 440px;min-height:0}
aside,section.center,section.right{min-height:0;min-width:0}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
section.right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:auto}
section.center{display:grid;grid-template-rows:minmax(0,.8fr) minmax(0,1fr);}
.pane-title{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.04em;flex-shrink:0}
.pane-title b{color:var(--text);font-weight:600;font-size:14px;letter-spacing:0}

/* tree */
.tree .gu{display:flex;align-items:center;height:46px;padding:0 16px;border-bottom:1px solid var(--line);cursor:pointer;gap:10px;position:relative;font-size:15px;font-weight:500}
.tree .gu:hover{background:#171c21}
.tree .gu .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
.tree .gu .cnt{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}
.tree .gu .arr{color:var(--muted);width:12px;font-size:10px;transition:transform .1s}
.tree .gu.open .arr{transform:rotate(90deg)}
.tree .kids{display:none;border-bottom:1px solid var(--line)}
.tree .kids.open{display:block}
.tree .site{display:flex;align-items:center;height:42px;padding:0 16px 0 38px;font-size:14px;cursor:pointer;position:relative;gap:10px}
.tree .site.sel{background:#1b222a;color:var(--hi);font-weight:600}
.tree .site.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hi)}
.tree .empty{padding:10px 16px 10px 38px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%}

/* map */
.mapwrap{position:relative;border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.map{position:relative;flex:1;min-height:0;background:#0b1014;overflow:hidden}
.map img.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.zonenav{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center;background:rgba(13,16,19,.85);border:1px solid var(--line2);padding:3px;border-radius:2px}
.zonenav button{width:26px;height:24px;border:0}
.zonenav span{padding:0 8px;font-size:12px;color:var(--hi)}
.maplabel{position:absolute;left:10px;top:10px;background:rgba(13,16,19,.85);border:1px solid var(--line2);padding:4px 9px;font-size:12px;color:var(--hi);border-radius:2px}

/* camera */
.cam{display:flex;flex-direction:column;min-height:0}
.cam .view{position:relative;flex:1;min-height:0;background:#07090b;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:none}
.cam .nosig{color:#4a545d;font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-align:center;line-height:1.8}
.cam .osd{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:#d6dde3;text-shadow:0 0 3px #000}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--lv3);animation:bl 1.4s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

/* right */
.rows .row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l t" "v s";gap:6px 12px;padding:18px 16px;border-bottom:1px solid var(--line);position:relative}
.rows .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--lv0))}
.row .l{grid-area:l;color:var(--muted);font-size:14px}
.row .t{grid-area:t;font-size:13px;font-weight:600;color:var(--c)}
.row .v{grid-area:v;font-size:42px;color:var(--hi);line-height:1.1}
.row .v small{font-size:15px;color:var(--muted);margin-left:6px;font-family:Pretendard,sans-serif}
.row .s{grid-area:s;align-self:end}
.row .s svg{display:block;width:150px;height:38px}
.thr{display:flex;gap:14px;font-size:12px;color:var(--muted);font-family:var(--mono);padding:10px 16px;border-bottom:1px solid var(--line)}

.overall{padding:22px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--c,var(--lv0))}
.overall .k{font-size:13px;color:var(--muted)}
.overall .big{font-size:34px;font-weight:700;color:var(--c);margin:4px 0 6px}
.overall p{font-size:14px;color:var(--muted)}
.overall .btns{display:flex;gap:8px;margin-top:16px}
.overall .btns button{flex:1;height:42px;font-size:14px}
.overall .btns button.pri{background:var(--hi);color:#0d1013;border-color:var(--hi);font-weight:600}
.overall .btns button.pri:hover{background:#fff}

.log{flex:1;min-height:120px}
.log ul{list-style:none}
.log li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.log li time{font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:2px}
.log li em{font-style:normal;color:var(--c)}
</style>
</head>
<body>

<header>
  <div class="logo">LOGO</div>
  <h1>부산 방파제 위험 감시</h1>
  <div class="sp"></div>
  <div class="meta">
    <span>갱신 <b class="num" id="hdrTime">--:--:--</b></span>
    <span>알림 <span class="badge" id="alertCnt">0</span></span>
    <span><b>관제 담당</b></span>
  </div>
</header>

<main>
  <aside>
    <div class="pane-title"><b>감시 구역</b><span id="siteTotal"></span></div>
    <div class="tree" id="tree"></div>
  </aside>

  <section class="center">
    <div class="mapwrap">
      <div class="pane-title"><b id="siteName">-</b><span class="num" id="coord">35.1 N, 129.0 E</span></div>
      <div class="map" id="map">
        <img class="base" id="mapImg" alt="">
        <svg id="chart" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="maplabel" id="zoneLabel"></div>
        <div class="zonenav">
          <button id="prev">&lsaquo;</button><span class="num" id="zoneIdx"></span><button id="next">&rsaquo;</button>
        </div>
      </div>
    </div>

    <div class="cam">
      <div class="pane-title"><b id="camName">-</b><span id="camStat"></span></div>
      <div class="view">
        <video id="camVideo" autoplay muted playsinline></video>
        <img id="camImg" alt="">
        <div class="nosig" id="nosig">NO SIGNAL<br><span style="font-size:10px;letter-spacing:.05em">CAM_SRC 미설정</span></div>
        <div class="osd"><span class="live"><i></i>LIVE</span><span id="osdTime">-</span></div>
      </div>
    </div>
  </section>

  <section class="right">
    <div class="pane-title"><b>실시간 관측</b><span>1시간 추이</span></div>
    <div class="rows" id="rows"></div>
    <div class="thr"><span>■ 정상</span><span style="color:var(--lv1)">■ 주의</span><span style="color:var(--lv2)">■ 경계</span><span style="color:var(--lv3)">■ 위험</span></div>

    <div class="overall" id="overall">
      <div class="k">종합 등급</div>
      <div class="big" id="ovLevel">-</div>
      <p id="ovReason"></p>
      <div class="btns"><button>이력 조회</button><button class="pri">상세 보기</button></div>
    </div>

    <div class="pane-title"><b>최근 이벤트</b><span>샘플</span></div>
    <div class="log"><ul id="log"></ul></div>
  </section>
</main>

<script>
/* ===== 설정: 여기만 바꾸면 됩니다 ===== */
const CONFIG = {
  MAP_IMG: '',   // 실제 지도 캡처 이미지 경로 (예: 'map_b.png'). 비워두면 해도풍 도면 표시
  CAM_SRC: '',   // 카메라 영상(mp4) 또는 이미지(jpg/png) 경로. 비워두면 NO SIGNAL
};

/* ===== 데이터 (API 연결 시 이 부분을 교체) ===== */
const DATA = {
  sites: {
    '동구': [{name:'부산항 북항 방파제', zones:['A','B','C','D'], cam:'CAM-B01'}],
    '남구': [], '북구': [], '해운대구': [], '수영구': [], '강서구': [],
  },
  obs: {
    wind:{label:'풍속', value:2.5, unit:'m/s', thr:[8,14,21],  series:[1.8,2.1,2.4,2.2,2.9,2.6,2.3,2.7,2.5,2.4,2.6,2.5]},
    rain:{label:'강수량', value:3.0, unit:'mm/h', thr:[10,30,50], series:[0,0,0.5,1,1.5,2,2.5,3.5,3,2.8,3.2,3.0]},
    wave:{label:'파고', value:0.5, unit:'m', thr:[1,2,3],       series:[0.4,0.4,0.5,0.6,0.5,0.4,0.5,0.6,0.5,0.5,0.4,0.5]},
  },
  events:[
    ['23:02','rain',1,'강수량 3.0 mm/h 로 상승'],
    ['22:40','info',0,'B구역 센서 점검 완료'],
    ['21:15','wave',0,'파고 0.5 m 안정'],
    ['19:58','wind',1,'풍속 8.2 m/s 순간 기록'],
  ],
};
const LV = [
  {n:'정상', c:'var(--lv0)'}, {n:'주의', c:'var(--lv1)'},
  {n:'경계', c:'var(--lv2)'}, {n:'위험', c:'var(--lv3)'},
];
const level=(v,t)=> v>=t[2]?3 : v>=t[1]?2 : v>=t[0]?1 : 0;

/* ===== 상태 ===== */
let curSite = DATA.sites['동구'][0];
let zone = 1; // B구역

/* ===== 사이드바 ===== */
function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  let total=0;
  for(const [gu,sites] of Object.entries(DATA.sites)){
    total+=sites.length;
    const g=document.createElement('div'); g.className='gu'+(sites.length?' open':'');
    g.innerHTML=`<span class="bar" style="background:${sites.length?LV[overallLv()].c:'var(--line2)'}"></span>
      <span class="arr">▶</span><span>${gu}</span><span class="cnt num">${sites.length||'-'}</span>`;
    const k=document.createElement('div'); k.className='kids'+(sites.length?' open':'');
    if(sites.length){
      sites.forEach(s=>{
        const d=document.createElement('div'); d.className='site'+(s===curSite?' sel':'');
        d.innerHTML=`<span class="dot" style="background:${LV[overallLv()].c}"></span>${s.name}`;
        d.onclick=()=>{curSite=s;renderAll()};
        k.appendChild(d);
      });
    } else k.innerHTML='<div class="empty">등록된 시설 없음</div>';
    g.onclick=()=>{g.classList.toggle('open');k.classList.toggle('open')};
    tree.append(g,k);
  }
  document.getElementById('siteTotal').textContent=`${total}개소`;
}

/* ===== 관측값 ===== */
function spark(arr,color){
  const w=150,h=38,min=Math.min(...arr),max=Math.max(...arr),r=(max-min)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-4-(v-min)/r*(h-8)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function overallLv(){
  return Math.max(...Object.values(DATA.obs).map(o=>level(o.value,o.thr)));
}
function renderObs(){
  const rows=document.getElementById('rows'); rows.innerHTML='';
  for(const o of Object.values(DATA.obs)){
    const lv=level(o.value,o.thr), c=LV[lv].c;
    const r=document.createElement('div'); r.className='row'; r.style.setProperty('--c',c);
    r.innerHTML=`<span class="l">${o.label}</span><span class="t">${LV[lv].n}</span>
      <span class="v num">${o.value.toFixed(1)}<small>${o.unit}</small></span>
      <span class="s">${spark(o.series,c)}</span>`;
    rows.appendChild(r);
  }
  const lv=overallLv(), ov=document.getElementById('overall');
  ov.style.setProperty('--c',LV[lv].c);
  document.getElementById('ovLevel').textContent=LV[lv].n;
  const hot=Object.values(DATA.obs).filter(o=>level(o.value,o.thr)>0).map(o=>o.label);
  document.getElementById('ovReason').textContent = hot.length
    ? `기준 초과 항목: ${hot.join(', ')}`
    : '모든 항목이 주의 기준 미만입니다.';
  document.getElementById('alertCnt').textContent = DATA.events.filter(e=>e[2]>0).length;
  document.getElementById('alertCnt').style.background = lv?LV[lv].c:'var(--line2)';
}

/* ===== 이벤트 로그 ===== */
function renderLog(){
  document.getElementById('log').innerHTML = DATA.events.map(([t,,lv,msg])=>
    `<li style="--c:${LV[lv].c}"><time>${t}</time><span><em>${lv?LV[lv].n+' · ':''}</em>${msg}</span></li>`).join('');
}

/* ===== 해도풍 도면 ===== */
function renderChart(){
  const svg=document.getElementById('chart');
  let g='';
  // 격자
  for(let x=0;x<=800;x+=50) g+=`<line x1="${x}" y1="0" x2="${x}" y2="400" stroke="#141c22" stroke-width="1"/>`;
  for(let y=0;y<=400;y+=50) g+=`<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="#141c22" stroke-width="1"/>`;
  // 등심선(수심)
  const depth=[['M0 330 C200 300 380 340 800 290',''],['M0 270 C220 240 400 290 800 230','5'],['M0 205 C230 180 420 240 800 170','10']];
  depth.forEach(([d,l])=>{
    g+=`<path d="${d}" fill="none" stroke="#1f2d38" stroke-width="1"/>`;
    g+=`<text x="12" y="${l==='5'?262:l==='10'?196:322}" fill="#3a4b58" font-size="9" font-family="monospace">${l?l+'m':''}</text>`;
  });
  // 방파제 본체
  const pathD='M120 330 C260 320 380 270 520 190 S690 85 720 70';
  g+=`<path id="bw" d="${pathD}" fill="none" stroke="#3a4753" stroke-width="16" stroke-linecap="butt"/>`;
  g+=`<path d="${pathD}" fill="none" stroke="#56646f" stroke-width="1"/>`;
  svg.innerHTML=g+'<g id="mk"></g>'
    +`<g font-family="monospace" font-size="10" fill="#5b6a76">
        <line x1="40" y1="372" x2="140" y2="372" stroke="#5b6a76"/><line x1="40" y1="368" x2="40" y2="376" stroke="#5b6a76"/><line x1="140" y1="368" x2="140" y2="376" stroke="#5b6a76"/>
        <text x="40" y="386">0      100 m</text>
        <text x="752" y="30">N</text><line x1="758" y1="34" x2="758" y2="56" stroke="#5b6a76"/>
      </g>`;
  // 센서 마커
  const bw=document.getElementById('bw'), L=bw.getTotalLength(), N=20, per=N/DATA.sites['동구'][0].zones.length;
  let m='';
  for(let i=0;i<N;i++){
    const p=bw.getPointAtLength(L*(i+.5)/N), z=Math.floor(i/per), on=z===zone;
    m+=`<rect x="${p.x-3.5}" y="${p.y-3.5}" width="7" height="7" fill="${on?LV[overallLv()].c:'#0b1014'}" stroke="${on?'#e8edf1':'#6a7884'}" stroke-width="1"/>`;
    if(on && i%per===1) m+=`<text x="${p.x+10}" y="${p.y-10}" fill="#c8d0d8" font-size="10" font-family="monospace">S-${String(i+1).padStart(2,'0')}</text>`;
  }
  document.getElementById('mk').innerHTML=m;
}

/* ===== 구역/카메라 ===== */
function renderZone(){
  const zs=curSite.zones, z=zs[zone];
  document.getElementById('siteName').textContent=curSite.name;
  document.getElementById('zoneLabel').textContent=`${z}구역`;
  document.getElementById('zoneIdx').textContent=`${zone+1} / ${zs.length}`;
  document.getElementById('camName').textContent=`${curSite.cam.replace('01','')}${String(zone+1).padStart(2,'0')} · ${z}구역`;
  document.getElementById('camStat').textContent = CONFIG.CAM_SRC ? '수신 중' : '신호 없음';
}
function setMedia(){
  const mi=document.getElementById('mapImg');
  if(CONFIG.MAP_IMG){mi.src=CONFIG.MAP_IMG;mi.style.display='block';}
  const s=CONFIG.CAM_SRC; if(!s) return;
  document.getElementById('nosig').style.display='none';
  const isVid=/\.(mp4|webm|m3u8)$/i.test(s);
  const el=document.getElementById(isVid?'camVideo':'camImg');
  el.src=s; el.style.display='block';
}

/* ===== 시계 ===== */
const pad=n=>String(n).padStart(2,'0');
function tick(){
  const d=new Date();
  const date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const t=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById('hdrTime').textContent=t;
  document.getElementById('osdTime').textContent=`${date} ${t}`;
}
setInterval(tick,1000); tick();

/* ===== 구동 ===== */
document.getElementById('prev').onclick=()=>{zone=(zone-1+curSite.zones.length)%curSite.zones.length;renderZone();renderChart()};
document.getElementById('next').onclick=()=>{zone=(zone+1)%curSite.zones.length;renderZone();renderChart()};
function renderAll(){renderTree();renderObs();renderLog();renderZone();renderChart();setMedia();}
renderAll();
</script>
</body>
</html>
